version: 2.1

# https://circleci.com/developer/machine/image/ubuntu-2204#image-tags

parameters:
  run_manual_arm:
    type: boolean
    default: false
  # Mimo nazwy nie jest to wylacznie uruchomienie reczne: ten sam parametr ustawia
  # trigger `cron-shedule` skonfigurowany w UI CircleCI (0 4 5,15,25 * *, galaz
  # master). Nazwa zostaje, bo trigger przekazuje ja doslownie — zmiana wymagalaby
  # rownoczesnej edycji triggera po stronie UI.
  run_manual_nightly_full:
    type: boolean
    default: false
  run_manual_ablation:
    type: boolean
    default: false
  # Sama bramka badawcza, bez reszty przebiegu nocnego. Wylacznie z reki: README
  # bramki przewiduje uruchomienie "recznie przed wysłaniem artykułu do
  # recenzji", a dotad jedynym wejsciem byl trigger `cron-shedule` razem z
  # calym `manual-nightly-full`. Harmonogramu ten parametr nie ma i miec nie
  # musi — bramka biegnie dalej 3 razy w miesiacu w warstwie L3 tamtego
  # workflow, z cieplym ccache po build-release-ninja-mydocker.
  run_manual_research_gate:
    type: boolean
    default: false
  # Budy na generatorze Makefile: czysta Ubuntu (z pakietowaniem) i ARM. Wyjete
  # 2026-08-19 z `manual-nightly-full`, ktory zostal przy samym ninja na obrazie
  # projektu. Powod: te dwa joby nie maja ani ccache, ani prebuiltow conana z
  # docker/ci/Dockerfile, wiec kosztuja wielokrotnie wiecej niz ich odpowiedniki
  # ninja, a sprawdzaja co innego (przenosnosc na stockowym toolchainie, nie
  # zachowanie silnika). Uruchamiane z reki, gdy pyta sie wlasnie o przenosnosc.
  run_manual_make_build:
    type: boolean
    default: false

workflows:
  # Warstwa commitowa. Jeden job: kompilacja Debug i pelny zestaw testow.
  commit:
    # Pipeline uruchomiony przez trigger cronowy albo recznie z parametrem ma
    # galaz master, wiec bez tego warunku `commit` dokladalby drugi, zbedny
    # build-debug-ninja-mydocker obok workflow parametrowego.
    when:
      and:
        - not: << pipeline.parameters.run_manual_nightly_full >>
        - not: << pipeline.parameters.run_manual_arm >>
        - not: << pipeline.parameters.run_manual_ablation >>
        - not: << pipeline.parameters.run_manual_research_gate >>
        - not: << pipeline.parameters.run_manual_make_build >>
    jobs:
      - build-debug-ninja-mydocker:
          filters:
            branches:
              only:
                - master
                - /[Ii]ssue_.*/
                - /[0-9]+[-].*/

  manual-arm:
    when: << pipeline.parameters.run_manual_arm >>
    jobs:
      - build-ARM

  # Pelny przebieg: trzy razy w miesiacu z triggera `cron-shedule` albo recznie.
  # Do 2026-08-18 istnial obok blizniaczy workflow `nightly-full` z wlasnym
  # `triggers.schedule` o tym samym cronie — scalony tutaj, zeby jeden harmonogram
  # nie byl zapisany w dwoch miejscach.
  #
  # Trzy warstwy, kazda odcina nastepna:
  #   L1  smoke  — sama kompilacja Debug; zatrzymuje reszte w kilka minut;
  #   L2  pelny zestaw testow (189) w Debug i Release na obrazie projektu;
  #   L3  bramka badawcza H9/H10 — najdrozszy job przebiegu.
  #
  # Od 2026-08-19 wylacznie budy na ninja i na obrazie projektu. Budy makefile
  # (czysta Ubuntu, ARM) wyjechaly do `manual-make-build`, a `build-debug` na
  # czystej Ubuntu zniknal calkiem: jego pokrycie bylo przecieciem dwoch innych
  # jobow — przenosnosc na stockowym toolchainie sprawdza `build-release` (ktory
  # jako jedyny robi tez `run-package`), a pelny zestaw Debug `build-debug-
  # ninja-mydocker`.
  manual-nightly-full:
    when: << pipeline.parameters.run_manual_nightly_full >>
    jobs:
      # -- L1 ---------------------------------------------------------------
      - smoke-debug-ninja-mydocker
      # -- L2 ---------------------------------------------------------------
      - build-release-ninja-mydocker:
          requires:
            - smoke-debug-ninja-mydocker
      - build-debug-ninja-mydocker:
          check_skipci: false
          requires:
            - smoke-debug-ninja-mydocker
      # -- L3 ---------------------------------------------------------------
      - research-gate:
          requires:
            - build-release-ninja-mydocker
      # PODLOGA matrycy ablacyjnej, jeden job zamiast siedmiu. Pelna matryca
      # `manual-ablation` odpowiada na pytanie "ktory przelacznik", a ta konfiguracja
      # na pytanie "czy w ogole" — i to ona wychwytuje regresje. Dowod z 2026-08-19:
      # matryca byla zepsuta od zmiany reguly `>N` z 2026-08-07, dwanascie dni bez
      # wykrycia, bo `manual-ablation` jest wylacznie reczna; wszystkie cztery awarie
      # zlapal wlasnie wariant all-off, warianty jednoczynnikowe nie dolozyly zadnej.
      # Trzy przebiegi w miesiacu skracaja okno wykrycia z tygodni do dni za koszt
      # jednego jobu dockerowego.
      - build-release-ablation:
          name: ablation-all-off
          dedup: "OFF"
          share: "OFF"
          commutative: "OFF"
          factor: "OFF"
          simplify: "OFF"
          requires:
            - build-release-ninja-mydocker

  # Sama bramka badawcza H9/H10, bez L1 i L2. Uruchamiana z reki, gdy trzeba
  # potwierdzic, ze wyniki sie nie cofnely — np. przed zgloszeniem artykulu —
  # zamiast czekac na najblizszy przebieg `manual-nightly-full`.
  #
  # Bez `requires`, wiec job idzie od razu. Cena: ccache zapisywany przez
  # build-release-ninja-mydocker jest tu tylko ODCZYTYWANY, a poza przebiegiem
  # nocnym nie ma wpisu dla tego samego commita — zaladuje sie klucz prefiksowy
  # ze starszej rewizji i pierwszy profil ablacji zbuduje sie dluzej. Dlatego
  # ten workflow jest dodatkiem, a nie zamiennikiem warstwy L3.
  research-gate-only:
    when: << pipeline.parameters.run_manual_research_gate >>
    jobs:
      - research-gate

  # Budy na generatorze Makefile, poza przebiegiem nocnym. Odpowiadaja na jedno
  # pytanie: czy projekt stawia sie na stockowym toolchainie, poza obrazem
  # projektu — na czystej Ubuntu (`build-release`, wraz z pakietem CPack) i na
  # ARM. Bez `requires`: oba joby sa niezalezne i maja lecac rownolegle.
  #
  # `build-ARM` jest osiagalny takze przez `manual-arm` — to jest celowe: tamten
  # workflow uruchamia sam ARM, ten caly zestaw makefile.
  manual-make-build:
    when: << pipeline.parameters.run_manual_make_build >>
    jobs:
      - build-release
      - build-ARM

  # Optimizer ablation matrix — manual only, never scheduled and never
  # commit-triggered. One-factor-at-a-time over the RDB_OPT_* switches plus the
  # all-off floor and a probe-instrumented build. The all-off configuration runs
  # first: it is the one most likely to fail, so the remaining variants are not
  # started when the floor is already broken.
  manual-ablation:
    when: << pipeline.parameters.run_manual_ablation >>
    jobs:
      - build-release-ablation:
          name: ablation-all-off
          dedup: "OFF"
          share: "OFF"
          commutative: "OFF"
          factor: "OFF"
          simplify: "OFF"
      - build-release-ablation:
          name: ablation-no-dedup
          dedup: "OFF"
          requires:
            - ablation-all-off
      - build-release-ablation:
          name: ablation-no-share
          # RDB_OPT_COMMUTATIVE_ADD=ON with share OFF is rejected by CMake.
          share: "OFF"
          commutative: "OFF"
          requires:
            - ablation-all-off
      - build-release-ablation:
          name: ablation-no-commutative
          commutative: "OFF"
          requires:
            - ablation-all-off
      - build-release-ablation:
          name: ablation-no-factor
          factor: "OFF"
          requires:
            - ablation-all-off
      - build-release-ablation:
          name: ablation-no-simplify
          simplify: "OFF"
          requires:
            - ablation-all-off
      - build-release-ablation:
          # Measurement instrumentation, not an optimizer switch — kept in the
          # matrix so the probe code cannot rot unnoticed.
          name: ablation-probe-on
          probe: "ON"
          requires:
            - ablation-all-off

  nightly-partial:
    triggers:
      - schedule:
          # 0 19 * * 1
          # At 19:00 on Monday..
          cron: "0 19 * * 1"
          filters:
            branches:
              only:
                - /[Ii]ssue_.*/
    jobs:
      - build-release-ninja-mydocker
      - build-debug-ninja-mydocker:
          check_skipci: false
      - build-ARM:
          filters:
            branches:
              only:
                - /[Ii]ssue_.*/


executors:
  debian-mydocker:
    docker:
      - image: micwide/buildenv-retractordb:latest
    resource_class: large

  ubuntu-docker:
    docker:
      # Use 'current' to always receive the latest security patches.
      - image: cimg/base:current
    resource_class: large

  ubuntu-machine-arm:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.large

commands:
  check-skipci:
    parameters:
      enabled:
        type: boolean
        default: true
    steps:
      - when:
          condition: << parameters.enabled >>
          steps:
            - run:
                name: Check whether commit-triggered CI can be skipped
                command: |
                  if git log -1 --pretty=%B | grep -qF '[skipci]'; then
                    echo "Commit message contains [skipci] — skipping CI."
                    circleci step halt
                  fi
      - unless:
          condition: << parameters.enabled >>
          steps:
            - run:
                name: Commit skip check disabled (scheduled/manual workflow)
                command: echo "Ignoring the [skipci] check — this is not a commit-triggered workflow."

  prep-env-ci:
    parameters:
      use_ninja:
        type: boolean
        default: false
    steps:
      - run:
          name: Install build toolchain (minimal, CI only)
          command: |
            scripts/buildrdb.sh toolchain_required conan
            echo 'source ~/.venv/bin/activate' >> "$BASH_ENV"
      - run:
          name: Validate installed toolchain
          command: |
            scripts/buildrdb.sh validate
      - when:
          condition: << parameters.use_ninja >>
          steps:
            - run:
                name: Configure Ninja generator
                command: scripts/buildrdb.sh ninja

  prep-env:
    parameters:
      use_ninja:
        type: boolean
        default: false
    steps:
      - run:
          name: Install toolchain (C++23 verified)
          command: |
            uname -a && cat /proc/version && cat /etc/issue
            scripts/buildrdb.sh toolchain conan
            echo 'source ~/.venv/bin/activate' >> "$BASH_ENV"
      - run:
          name: Validate installed toolchain
          command: |
            scripts/buildrdb.sh validate
      - when:
          condition: << parameters.use_ninja >>
          steps:
            - run:
                name: Configure Ninja generator
                command: scripts/buildrdb.sh ninja

  # ccache przeżywa job tylko dzięki cache'owi CircleCI — kontener startuje pusty.
  # Podpięcie ccache jako CMAKE_CXX_COMPILER_LAUNCHER robi CMakeLists.txt samo,
  # gdy znajdzie binarkę (RDB_USE_CCACHE, domyślnie ON).
  # Używane wyłącznie w jobach na executorze debian-mydocker: tylko tam ccache jest
  # pewny (wbudowany w obraz). prep-env-ci wywołuje toolchain_required, gdzie ccache
  # jest 'optional' i nie instaluje się automatycznie.
  ccache-restore:
    parameters:
      cache_id:
        type: string
    steps:
      - run:
          name: Configure ccache
          command: |
            # ccache 4.x domyślnie trzyma cache w ~/.cache/ccache (XDG). Bez jawnego
            # CCACHE_DIR save_cache zapisywałby pusty ~/.ccache i nic by nie działało.
            echo 'export CCACHE_DIR="$HOME/.ccache"' >> "$BASH_ENV"
            # Domyślne 5 GiB to o rząd wielkości za dużo jak na cache CircleCI.
            echo 'export CCACHE_MAXSIZE=500M' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - ccache-v1-<< parameters.cache_id >>-{{ arch }}-{{ .Branch }}-{{ .Revision }}
            - ccache-v1-<< parameters.cache_id >>-{{ arch }}-{{ .Branch }}-
            - ccache-v1-<< parameters.cache_id >>-{{ arch }}-master-
      - run:
          name: Reset ccache statistics
          command: ccache -z

  ccache-save:
    parameters:
      cache_id:
        type: string
    steps:
      - run:
          name: ccache statistics
          command: ccache -s
      - save_cache:
          # Klucze CircleCI są niezmienne — {{ .Revision }} daje nowy wpis na commit,
          # a prefiksy w restore_cache pozwalają odziedziczyć cache poprzedniego.
          key: ccache-v1-<< parameters.cache_id >>-{{ arch }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.ccache

  conan-install:
    parameters:
      build_type:
        type: string
        default: "Release"
      build_param:
        type: string
        default: ""
      build_tool:
        type: string
        default: "make"
    steps:
      - run:
          name: Conan install (project dependencies)
          command: |
            conan source .
            conan install . -s build_type=<< parameters.build_type >> << parameters.build_param >>
  conan-build:
    parameters:
      build_type:
        type: string
        default: "Release"
      build_param:
        type: string
        default: ""
      build_tool:
        type: string
        default: "make"
    steps:
      - run:
          name: "Conan build (<< parameters.build_tool >>)"
          command: |
            conan build . -s build_type=<<parameters.build_type>> <<parameters.build_param>>
            cd build/<<parameters.build_type>> && <<parameters.build_tool>> install
  run-test:
    parameters:
      build_type:
        type: string
        default: "Release"
      build_tool:
        type: string
        default: "make"
    steps:
      - run:
          name: Smoke test
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            cd build/<< parameters.build_type >> && << parameters.build_tool >> showelf
            xretractor -h
            xqry -h
            xtrdb -h
      - run:
          name: Integration & Unit test
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            cd build/<< parameters.build_type >>/test && ctest -j "$(nproc)" -V --output-junit test_results.xml
      - store_test_results:
          path: build/<< parameters.build_type >>/test
      - store_artifacts:
          path: build/<< parameters.build_type >>/test/test_results.xml
          destination: test_results.xml
  run-cppcheck:
    parameters:
      build_type:
        type: string
        default: "Release"
      build_tool:
        type: string
        default: "make"
    steps:
      - run:
          name: Static analysis
          command: |
            cd build/<< parameters.build_type >> && << parameters.build_tool >> cppcheck
  run-package:
    parameters:
      build_type:
        type: string
        default: "Release"
      build_tool:
        type: string
        default: "make"
    steps:
      - run:
          name: Package
          command: |
            cd build/<<parameters.build_type>> && <<parameters.build_tool>> packages

jobs:
  # L1 pelnego przebiegu: SAMA kompilacja Debug. Zadanie tego jobu to odciac
  # warstwe 2, kiedy drzewo sie nie kompiluje — zamiast dowiadywac sie o tym po
  # pelnym zestawie 189 testow. Zapisuje cache ccache dla `mydocker-debug`, wiec
  # build-debug-ninja-mydocker w warstwie 2 startuje z goracego cache.
  #
  # Do 2026-08-19 byl tu jeszcze krok `ctest -R '^ut_'` — zdjety, bo byla to
  # JEDYNA czesc tego jobu nieznajdujaca sie juz w `build-debug-ninja-mydocker`
  # (ten sam obraz, te same kroki, ten sam klucz ccache — tylko pelne `run-test`
  # zamiast samych `ut_`), a zarazem najdrozsza: 45 binarek jednostkowych pod
  # valgrindem, liczonych dwa razy w jednym przebiegu. Pokrycie nie ginie — te
  # same testy wykonuje warstwa L2 kilkanascie minut pozniej.
  smoke-debug-ninja-mydocker:
    working_directory: ~/retractordb
    executor: debian-mydocker
    steps:
      - checkout:
          method: blobless
      - check-skipci:
          enabled: false
      - prep-env:
          use_ninja: true
      - ccache-restore:
          cache_id: mydocker-debug
      - conan-install:
          build_type: Debug
          build_param: --build missing
          build_tool: ninja
      - conan-build:
          build_type: Debug
          build_param: --build missing
          build_tool: ninja
      - ccache-save:
          cache_id: mydocker-debug

  build-release-ninja-mydocker:
    working_directory: ~/retractordb
    executor: debian-mydocker
    steps:
      - checkout:
          method: blobless
      - check-skipci:
          enabled: false
      - prep-env:
          use_ninja: true
      - ccache-restore:
          cache_id: mydocker-release
      - conan-install:
          build_param: --build missing
          build_tool: ninja
      - conan-build:
          build_param: --build missing
          build_tool: ninja
      - ccache-save:
          cache_id: mydocker-release
      - run-test:
          build_tool: ninja

  build-debug-ninja-mydocker:
    parameters:
      check_skipci:
        type: boolean
        default: true
    working_directory: ~/retractordb
    executor: debian-mydocker
    steps:
      - checkout:
          method: blobless
      - check-skipci:
          enabled: << parameters.check_skipci >>
      - prep-env:
          use_ninja: true
      - ccache-restore:
          cache_id: mydocker-debug
      - conan-install:
          build_type: Debug
          build_param: --build missing
          build_tool: ninja
      - conan-build:
          build_type: Debug
          build_param: --build missing
          build_tool: ninja
      - ccache-save:
          cache_id: mydocker-debug
      - run-test:
          build_type: Debug
          build_tool: ninja

  # Bramka badawcza H9/H10 — ochrona osiagnietych wynikow przed regresja silnika
  # (test/research_gate/README.md). Celowo poza `ninja` i poza `ninja test`, wiec
  # musi byc wywolana jawnie; L3, bo to najdrozszy job w przebiegu.
  #
  # Release, nie Debug: bramka wykonuje ok. 20 000 kompilacji planow przez
  # xretractor. Sprawdzane zachowanie jest w obu konfiguracjach identyczne, czas
  # przebiegu nie jest.
  research-gate:
    working_directory: ~/retractordb
    executor: debian-mydocker
    steps:
      - checkout:
          method: blobless
      - check-skipci:
          enabled: false
      - prep-env:
          use_ninja: true
      # Sam odczyt. Klucz `mydocker-release` zapisuje build-release-ninja-mydocker,
      # ktory w tym workflow konczy sie przed tym jobem.
      - ccache-restore:
          cache_id: mydocker-release
      - conan-install:
          build_param: --build missing
          build_tool: ninja
      - run:
          name: Configure Release tree (gate in strict mode)
          command: |
            cmake \
              -S . \
              -B build/Release \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/build/Release/generators/conan_toolchain.cmake" \
              -DRESEARCH_GATE_STRICT=ON
      # Poziom 84/84 hipotezy H9 odroznia R1 od R2 wylacznie na czterech profilach
      # ablacji. Bez nich bramka ten poziom POMIJA, a w trybie strict pominiecie
      # jest bledem — wiec profile musza powstac tutaj, w tym samym jobie i z tej
      # samej tresci src/ (bramka sprawdza odcisk).
      #
      # Rownoleglosc: 4, nie `$(nproc)`. W kontenerze `nproc` podaje rdzenie
      # HOSTA (36), nie przydzial kontenera — a wiazacym limitem i tak jest
      # pamiec: jedna jednostka kompilacji tego drzewa siega ~1 GiB RSS
      # (zmierzone: executorsm.cpp 0,93 GiB, launcher.cpp 0,86 GiB), executor
      # `large` ma 8 GiB. 36 rownoleglych g++ to ~30 GiB, czyli OOM: 2026-08-19
      # krok padl po 45 s bez jednej linii bledu i bez artefaktow, bo zabity
      # krok nie dochodzi do store_artifacts. Inne joby przechodza dlatego, ze
      # buduje je `conan build`, a conan liczy rownoleglosc z limitu cgroup, nie
      # z `nproc`. Liczba 4 idzie za `resource_class: large` (4 vCPU / 8 GiB) —
      # przy zmianie klasy executora zmienic tutaj.
      #
      # DRUGIE ZRODLO TEJ SAMEJ REGULY: `compute_build_jobs()` w
      # scripts/buildrdb.sh (~850 MB na zadanie, ~500 MB marginesu, wynik
      # ograniczony liczba rdzeni) — to jest ta sama arytmetyka, policzona dla
      # maszyny lokalnej. Kroku CI nie da sie do niej podpiac: kazdy `run:` to
      # osobna powloka, a funkcja siedzi w srodku 1500-liniowego skryptu. Stad
      # duplikat; przy zmianie zalozen poprawic OBA miejsca.
      #
      # `no_output_timeout`: CircleCI zabija krok, ktory przez 10 minut (domyslna
      # wartosc) nie napisal ani znaku. Oba te kroki sa z zalozenia MILCZACE:
      # wyjscie kompilatora idzie do plikow w build/gate-profiles-logs, a bramka
      # drukuje dopiero werdykt poziomu. Miedzy dwiema liniami "profil X ->"
      # mieszcza sie minuty pierwszego, zimnego profilu (lokalnie 4 min 20 s przy
      # -j4; na 4 vCPU kontenera odpowiednio dluzej), a w kroku bramki cala
      # kampania 2 x 10010 planow. Dzielenie tego na osobne kroki NIE pomaga —
      # limit liczy sie per krok, nie per job. Kolejne profile sa tansze: rozne
      # miedzy nimi sa tylko 19 ze 112 jednostek kompilacji (cel `retractor`),
      # reszta trafia w ccache.
      - run:
          name: Build H9 ablation profiles
          no_output_timeout: 30m
          command: |
            K6_CCACHE=1 K6_BUILD_JOBS=4 test/research_gate/h9/build_profiles.sh
      - run:
          name: Research gate H9/H10
          no_output_timeout: 30m
          command: |
            cmake --build build/Release --target test_gate --parallel 4
      # `when: always`: artefakty sa potrzebne WLASNIE wtedy, gdy bramka padla —
      # bez tego nieudany przebieg nie zostawia ani logow builda profili, ani
      # katalogu roboczego bramki.
      - store_artifacts:
          path: build/Release/test/research_gate/gate-work
          destination: research-gate
          when: always
      - store_artifacts:
          path: build/gate-profiles-logs
          destination: research-gate-profiles
          when: always

  build-release:
    working_directory: ~/retractordb
    executor: ubuntu-docker
    steps:
      - checkout:
          method: blobless
      - check-skipci:
          enabled: false
      - prep-env-ci
      - conan-install:
          build_param: --build missing
      - conan-build:
          build_param: --build missing
      - run-test
      - run-package

  # Release build with an explicit optimizer switch combination.
  # scripts/buildrdb.sh release-ablation is interactive, so the CMake
  # configuration is spelled out here instead of reusing that option.
  build-release-ablation:
    parameters:
      dedup:
        type: string
        default: "ON"
      share:
        type: string
        default: "ON"
      commutative:
        type: string
        default: "ON"
      factor:
        type: string
        default: "ON"
      simplify:
        type: string
        default: "ON"
      probe:
        type: string
        default: "OFF"
    working_directory: ~/retractordb
    executor: debian-mydocker
    steps:
      - checkout:
          method: blobless
      - check-skipci:
          enabled: false
      - prep-env:
          use_ninja: true
      - conan-install:
          build_param: --build missing
          build_tool: ninja
      - run:
          name: Configure ablation variant
          command: |
            cmake \
              -S . \
              -B build/Release \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/build/Release/generators/conan_toolchain.cmake" \
              -DRDB_OPT_DEDUP_SUBSTRATES=<< parameters.dedup >> \
              -DRDB_OPT_SHARE_EQUIVALENT_SELECTS=<< parameters.share >> \
              -DRDB_OPT_COMMUTATIVE_ADD=<< parameters.commutative >> \
              -DRDB_OPT_FACTOR_MATCHED_HASH_TIMEMOVES=<< parameters.factor >> \
              -DRDB_OPT_SIMPLIFY_EXPRESSIONS=<< parameters.simplify >> \
              -DRDB_BENCH_PROBE=<< parameters.probe >>
      # Rownoleglosc 4, nie `$(nproc)` i nie domyslna ninja (`nproc`+2): powod
      # jak w jobie research-gate wyzej — w kontenerze `nproc` podaje rdzenie
      # HOSTA, a jedna jednostka kompilacji tego drzewa siega ~1 GiB RSS przy
      # 8 GiB executora `large`. Odpowiednik `compute_build_jobs()` z
      # scripts/buildrdb.sh, policzony recznie dla tego executora.
      #
      # Od 2026-08-19 ten job jest tez podloga ablacyjna warstwy L3 przebiegu
      # nocnego (`ablation-all-off`), a nie tylko czescia recznej matrycy —
      # `--parallel 4` przestalo byc zabezpieczeniem teoretycznym.
      - run:
          name: Build and install ablation variant
          command: |
            cmake --build build/Release --parallel 4
            cd build/Release && ninja -j 4 install
      - run:
          name: Verify compiled switches match the requested profile
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            actual="$(xretractor --build-info)"
            expected="$(printf '%s\n' \
              "RDB_OPT_DEDUP_SUBSTRATES=<< parameters.dedup >>" \
              "RDB_OPT_SHARE_EQUIVALENT_SELECTS=<< parameters.share >>" \
              "RDB_OPT_COMMUTATIVE_ADD=<< parameters.commutative >>" \
              "RDB_OPT_FACTOR_MATCHED_HASH_TIMEMOVES=<< parameters.factor >>" \
              "RDB_BENCH_PROBE=<< parameters.probe >>" \
              "RDB_OPT_SIMPLIFY_EXPRESSIONS=<< parameters.simplify >>")"
            printf '%s\n' "$actual"
            if [ "$actual" != "$expected" ]; then
              echo "Error: built binary does not report the requested optimizer configuration."
              printf 'expected:\n%s\n' "$expected"
              exit 1
            fi
      - run-test:
          build_tool: ninja

  build-ARM:
    parameters:
      build_type:
        type: string
        default: "Debug"
      build_tool:
        type: string
        default: "make"
    working_directory: ~/retractordb
    executor: ubuntu-machine-arm
    steps:
      - checkout:
          method: blobless
      - check-skipci:
          enabled: false
      - prep-env-ci
      - run:
          name: Toolchain diagnostics (ARM)
          command: |
            uname -a || true
            gcc --version || true
            g++ --version || true
            g++ -dumpfullversion || true
            cmake --version || true
            ls /usr/include/c++/ || true
            echo "--- conan profile default ---"
            cat ~/.conan2/profiles/default || true
      - conan-install:
          build_type: << parameters.build_type >>
          build_param: --build missing
      - conan-build:
          build_type: << parameters.build_type >>
          build_param: --build missing
          build_tool: << parameters.build_tool >>
      - run-test:
          build_type: << parameters.build_type >>
          build_tool: << parameters.build_tool >>
