version: 2.1

# https://circleci.com/developer/machine/image/ubuntu-2204#image-tags

parameters:
  run_manual_arm:
    type: boolean
    default: false
  # Mimo nazwy nie jest to wylacznie uruchomienie reczne: ten sam parametr ustawia
  # trigger `cron-shedule` skonfigurowany w UI CircleCI (0 4 5,20 * *, galaz
  # master). Nazwa zostaje, bo trigger przekazuje ja doslownie - zmiana wymagalaby
  # rownoczesnej edycji triggera po stronie UI.
  run_manual_nightly_full:
    type: boolean
    default: false
  run_manual_ablation:
    type: boolean
    default: false
  # Sama bramka badawcza, bez reszty przebiegu nocnego. Wylacznie z reki: README
  # bramki przewiduje uruchomienie "recznie przed wysłaniem artykułu do
  # recenzji", a dotad jedynym wejsciem byl trigger `cron-shedule` razem z
  # calym `manual-nightly-full`. Harmonogramu ten parametr nie ma i miec nie
  # musi - bramka biegnie dalej 2 razy w miesiacu w warstwie L2 tamtego
  # workflow.
  run_manual_research_gate:
    type: boolean
    default: false
  # Budy na generatorze Makefile: czysta Ubuntu (z pakietowaniem) i ARM. Wyjete
  # 2026-08-19 z `manual-nightly-full`, ktory zostal przy samym ninja na obrazie
  # projektu. Powod: te dwa joby nie maja prebuiltow conana z
  # docker/ci/Dockerfile, wiec kosztuja wielokrotnie wiecej niz ich odpowiedniki
  # ninja, a sprawdzaja co innego (przenosnosc na stockowym toolchainie, nie
  # zachowanie silnika). Uruchamiane z reki, gdy pyta sie wlasnie o przenosnosc.
  run_manual_make_build:
    type: boolean
    default: false

  # Buda macOS/arm64 na runnerze Apple silicon. Wylacznie z reki, tak samo jak
  # `run_manual_arm` i z tego samego powodu: minuta runnera macOS kosztuje
  # wielokrotnie wiecej niz minuta kontenera linuksowego, a job sprawdza
  # PRZENOSNOSC - a ta nie zmienia sie z commita na commit. Tak samo jak ARM nie
  # ma tez prebuiltow conana z docker/ci/Dockerfile (obraz CircleCI nie jest
  # naszym obrazem), wiec pierwszy przebieg buduje Boost i ANTLR ze zrodel.
  run_manual_macos:
    type: boolean
    default: false

workflows:
  # Warstwa commitowa. Jeden job: kompilacja Debug i pelny zestaw testow.
  commit:
    # Pipeline uruchomiony przez trigger cronowy albo recznie z parametrem ma
    # galaz master, wiec bez tego warunku `commit` dokladalby drugi, zbedny
    # build-debug-ninja-mydocker obok workflow parametrowego.
    when:
      and:
        - not: << pipeline.parameters.run_manual_nightly_full >>
        - not: << pipeline.parameters.run_manual_arm >>
        - not: << pipeline.parameters.run_manual_ablation >>
        - not: << pipeline.parameters.run_manual_research_gate >>
        - not: << pipeline.parameters.run_manual_make_build >>
        - not: << pipeline.parameters.run_manual_macos >>
    jobs:
      - build-debug-ninja-mydocker:
          filters:
            branches:
              only:
                - master
                - /[Ii]ssue_.*/
                - /[0-9]+[-].*/

  manual-arm:
    when: << pipeline.parameters.run_manual_arm >>
    jobs:
      - build-ARM

  manual-macos:
    when: << pipeline.parameters.run_manual_macos >>
    jobs:
      - build-debug-macos

  # Pelny przebieg: dwa razy w miesiacu z triggera `cron-shedule` albo recznie.
  # Do 2026-08-18 istnial obok blizniaczy workflow `nightly-full` z wlasnym
  # `triggers.schedule` o tym samym cronie - scalony tutaj, zeby jeden harmonogram
  # nie byl zapisany w dwoch miejscach.
  #
  # Dwie warstwy, pierwsza odcina druga:
  #   L1  pelny zestaw testow (189) w Debug i Release na obrazie projektu;
  #   L2  bramka badawcza H9/H10 (najdrozszy job przebiegu) i podloga ablacyjna.
  #
  # Do 2026-09-19 przed nimi stal smoke - sama kompilacja Debug, ktora miala
  # zatrzymac reszte, gdy drzewo sie nie kompiluje. Usuniety, bo placil w kazdym
  # przebiegu, a zwracal tylko przy awarii kompilacji: bez niego takie drzewo
  # kosztuje dwie kompilacje L1 (L2 i tak nie rusza), z nim jedna. Oplacalby sie
  # dopiero przy wiecej niz polowie przebiegow z niekompilujacym sie masterem, a
  # kazdy push na master przechodzi juz workflow `commit`. Cache ccache, ktory
  # smoke przekazywal dalej, byl pusty - patrz uwaga w sekcji `commands`.
  #
  # Od 2026-08-19 wylacznie budy na ninja i na obrazie projektu. Budy makefile
  # (czysta Ubuntu, ARM) wyjechaly do `manual-make-build`, a `build-debug` na
  # czystej Ubuntu zniknal calkiem: jego pokrycie bylo przecieciem dwoch innych
  # jobow - przenosnosc na stockowym toolchainie sprawdza `build-release` (ktory
  # jako jedyny robi tez `run-package`), a pelny zestaw Debug `build-debug-
  # ninja-mydocker`.
  manual-nightly-full:
    when: << pipeline.parameters.run_manual_nightly_full >>
    jobs:
      # -- L1 ---------------------------------------------------------------
      - build-release-ninja-mydocker
      - build-debug-ninja-mydocker:
          check_skipci: false
      # -- L2 ---------------------------------------------------------------
      - research-gate:
          requires:
            - build-release-ninja-mydocker
      # PODLOGA matrycy ablacyjnej, jeden job zamiast siedmiu. Pelna matryca
      # `manual-ablation` odpowiada na pytanie "ktory przelacznik", a ta konfiguracja
      # na pytanie "czy w ogole" - i to ona wychwytuje regresje. Dowod z 2026-08-19:
      # matryca byla zepsuta od zmiany reguly `>N` z 2026-08-07, dwanascie dni bez
      # wykrycia, bo `manual-ablation` jest wylacznie reczna; wszystkie cztery awarie
      # zlapal wlasnie wariant all-off, warianty jednoczynnikowe nie dolozyly zadnej.
      # Dwa przebiegi w miesiacu (5. i 20.) ograniczaja okno wykrycia do ok. dwoch
      # tygodni - sama reczna matryca nie ogranicza go wcale - za koszt jednego
      # jobu dockerowego.
      - build-release-ablation:
          name: ablation-all-off
          dedup: "OFF"
          share: "OFF"
          commutative: "OFF"
          factor: "OFF"
          simplify: "OFF"
          requires:
            - build-release-ninja-mydocker
      # Kontrakt tekstowy sondy. Wiersze WORK/MATERIALIZED/LOGICAL/PLAN bench sa
      # porownywane co do znaku przez `ut_probe`, ale tylko w buildzie z
      # RDB_BENCH_PROBE=ON - poza ta konfiguracja galezie `if constexpr` oczekuja
      # pustego stderr i format nie jest sprawdzany przez nic. Dowod z 2026-09-04:
      # konwersja fprintf -> println scalila sklejane literaly i zgubila podwojne
      # spacje rozdzielajace grupy; caly przebieg commitowy byl zielony, awarie
      # zlapal dopiero reczny job `ablation-probe-on`.
      #
      # Rownolegle do podlogi, a nie za nia jak w `manual-ablation`: tam
      # serializacja oszczedza szesc jobow jednoczynnikowych, tutaj chodzi o dwa
      # niezalezne rodzaje regresji i czerwona podloga nie moze zaslonic sondy.
      - build-release-ablation:
          name: ablation-probe-on
          probe: "ON"
          requires:
            - build-release-ninja-mydocker

  # Sama bramka badawcza H9/H10, bez reszty przebiegu nocnego. Uruchamiana z
  # reki, gdy trzeba potwierdzic, ze wyniki sie nie cofnely - np. przed
  # zgloszeniem artykulu - zamiast czekac na najblizszy przebieg
  # `manual-nightly-full`.
  #
  # Bez `requires`, wiec job idzie od razu. Buduje i sprawdza to samo co job
  # warstwy L2 tamtego workflow - oba kompiluja od zera.
  research-gate-only:
    when: << pipeline.parameters.run_manual_research_gate >>
    jobs:
      - research-gate

  # Budy na generatorze Makefile, poza przebiegiem nocnym. Odpowiadaja na jedno
  # pytanie: czy projekt stawia sie na stockowym toolchainie, poza obrazem
  # projektu - na czystej Ubuntu (`build-release`, wraz z pakietem CPack) i na
  # ARM. Bez `requires`: oba joby sa niezalezne i maja lecac rownolegle.
  #
  # `build-ARM` jest osiagalny takze przez `manual-arm` - to jest celowe: tamten
  # workflow uruchamia sam ARM, ten caly zestaw makefile.
  manual-make-build:
    when: << pipeline.parameters.run_manual_make_build >>
    jobs:
      - build-release
      - build-ARM

  # Optimizer ablation matrix - manual only, never scheduled and never
  # commit-triggered. One-factor-at-a-time over the RDB_OPT_* switches plus the
  # all-off floor and a probe-instrumented build. The all-off configuration runs
  # first: it is the one most likely to fail, so the remaining variants are not
  # started when the floor is already broken.
  manual-ablation:
    when: << pipeline.parameters.run_manual_ablation >>
    jobs:
      - build-release-ablation:
          name: ablation-all-off
          dedup: "OFF"
          share: "OFF"
          commutative: "OFF"
          factor: "OFF"
          simplify: "OFF"
      - build-release-ablation:
          name: ablation-no-dedup
          dedup: "OFF"
          requires:
            - ablation-all-off
      - build-release-ablation:
          name: ablation-no-share
          # RDB_OPT_COMMUTATIVE_ADD=ON with share OFF is rejected by CMake.
          share: "OFF"
          commutative: "OFF"
          requires:
            - ablation-all-off
      - build-release-ablation:
          name: ablation-no-commutative
          commutative: "OFF"
          requires:
            - ablation-all-off
      - build-release-ablation:
          name: ablation-no-factor
          factor: "OFF"
          requires:
            - ablation-all-off
      - build-release-ablation:
          name: ablation-no-simplify
          simplify: "OFF"
          requires:
            - ablation-all-off
      - build-release-ablation:
          # Measurement instrumentation, not an optimizer switch - kept in the
          # matrix so the probe code cannot rot unnoticed.
          name: ablation-probe-on
          probe: "ON"
          requires:
            - ablation-all-off

  # Do 2026-09-13 byl tu `nightly-partial`: co poniedzialek Release, Debug i ARM na kazdej
  # galezi `issue_*`, takze na juz scalonej. Usuniety dla kosztu - jedynym harmonogramem
  # jest `cron-shedule` uruchamiajacy `manual-nightly-full`.

executors:
  debian-mydocker:
    docker:
      - image: micwide/buildenv-retractordb:latest
    resource_class: large

  ubuntu-docker:
    docker:
      # Use 'current' to always receive the latest security patches.
      - image: cimg/base:current
    resource_class: large

  ubuntu-machine-arm:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.large

  # Runner Apple silicon; wylacznie CircleCI Cloud (na Serverze go nie ma).
  #
  # Obraz `xcode: 27.0.0` to Xcode 27.0 na macOS 26.6.2 - a wiec NIE ta sama
  # wersja systemu, na ktorej powstal port (macOS 27.0), ale ten sam kompilator
  # i ten sam SDK. Podloga CMAKE_OSX_DEPLOYMENT_TARGET z CMakeLists.txt (14.4)
  # obejmuje obie, wiec roznica nie zmienia wyniku budowy; gdyby kiedys zmienila,
  # zobaczymy to tutaj wczesniej niz na maszynie developera.
  #
  # m4pro.medium to 6 vCPU / 28 GiB. m4pro.large (12 vCPU) skraca kompilacje, ale
  # kosztuje wiecej za minute i nie skraca testow, ktore w tym jobie dominuja.
  macos-m4:
    macos:
      xcode: 27.0.0
    resource_class: m4pro.medium

commands:
  check-skipci:
    parameters:
      enabled:
        type: boolean
        default: true
    steps:
      - when:
          condition: << parameters.enabled >>
          steps:
            - run:
                name: Check whether commit-triggered CI can be skipped
                command: |
                  if git log -1 --pretty=%B | grep -qF '[skipci]'; then
                    echo "Commit message contains [skipci] - skipping CI."
                    circleci step halt
                  fi
      - unless:
          condition: << parameters.enabled >>
          steps:
            - run:
                name: Commit skip check disabled (scheduled/manual workflow)
                command: echo "Ignoring the [skipci] check - this is not a commit-triggered workflow."

  prep-env-ci:
    parameters:
      use_ninja:
        type: boolean
        default: false
    steps:
      - run:
          name: Install build toolchain (minimal, CI only)
          command: |
            scripts/buildrdb.sh toolchain_required conan
            echo 'source ~/.venv/bin/activate' >> "$BASH_ENV"
      - run:
          name: Validate installed toolchain
          command: |
            scripts/buildrdb.sh validate
      - when:
          condition: << parameters.use_ninja >>
          steps:
            - run:
                name: Configure Ninja generator
                command: scripts/buildrdb.sh ninja

  prep-env:
    parameters:
      use_ninja:
        type: boolean
        default: false
    steps:
      - run:
          name: Install toolchain (C++23 verified)
          command: |
            uname -a && cat /proc/version && cat /etc/issue
            scripts/buildrdb.sh toolchain conan
            echo 'source ~/.venv/bin/activate' >> "$BASH_ENV"
      - run:
          name: Validate installed toolchain
          command: |
            scripts/buildrdb.sh validate
      - when:
          condition: << parameters.use_ninja >>
          steps:
            - run:
                name: Configure Ninja generator
                command: scripts/buildrdb.sh ninja

  # Do 2026-09-19 byla tu para ccache-restore / ccache-save, przenoszaca
  # ~/.ccache miedzy jobami przez cache CircleCI. Nie dzialala: skanowanie
  # modulow C++20 (flagi `-fmodules-ts -fmodule-mapper=`) i precompiled headers
  # bez sloppiness robily z niemal kazdej kompilacji wywolanie niebuforowalne -
  # zmierzone w obrazie CI, buforowalne byly 3 ze 144 jednostek. Obie przyczyny
  # usuwa od tego samego dnia CMakeLists.txt (CMAKE_CXX_SCAN_FOR_MODULES OFF,
  # CCACHE_SLOPPINESS w launcherze): przebudowa celu xretractor w tym samym
  # katalogu z cieplym cache trwa 10 s zamiast 58 s (8 CPU).
  #
  # Pary mimo to nie przywrocono. ccache biegnie teraz w kazdym jobie na obrazie
  # projektu (CMakeLists.txt podpina go sam, obraz go ma), ale job kompiluje
  # drzewo raz, wiec bez cache przenoszonego miedzy jobami nic nie zyskuje.
  # Czy przenoszenie sie oplaci - ile joba commitowego zajmuje kompilacja, a ile
  # testy pod valgrindem, i ile kosztuje przeslanie cache - to osobna decyzja,
  # do podjecia po pomiarze na CircleCI.

  conan-install:
    parameters:
      build_type:
        type: string
        default: "Release"
      build_param:
        type: string
        default: ""
      build_tool:
        type: string
        default: "make"
    steps:
      - run:
          name: Conan install (project dependencies)
          command: |
            conan source .
            conan install . -s build_type=<< parameters.build_type >> << parameters.build_param >>
  conan-build:
    parameters:
      build_type:
        type: string
        default: "Release"
      build_param:
        type: string
        default: ""
      build_tool:
        type: string
        default: "make"
    steps:
      - run:
          name: "Conan build (<< parameters.build_tool >>)"
          command: |
            conan build . -s build_type=<<parameters.build_type>> <<parameters.build_param>>
            cd build/<<parameters.build_type>> && <<parameters.build_tool>> install
  run-test:
    parameters:
      build_type:
        type: string
        default: "Release"
      build_tool:
        type: string
        default: "make"
    steps:
      - run:
          name: Smoke test
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            cd build/<< parameters.build_type >> && << parameters.build_tool >> showelf
            xretractor -h
            xqry -h
            xtrdb -h
      # Diagnostyka porazki jest w TYM SAMYM kroku co ctest, zeby kolektor dostal jego
      # prawdziwy kod wyjscia. Powod: 2026-09-04 `it_agse_array` oblal tutaj, a jedynym
      # sladem byl wpis w test_results.xml z pustym <system-out/> - czyli wiadomo bylo,
      # ZE oblal, i nic ponadto. Awaria nie powtorzyla sie lokalnie w 31 pelnych
      # przebiegach, wiec bez zebranych dowodow kolejne takie zdarzenie tez byloby
      # nie do zbadania.
      #
      # Kod wyjscia jest przekazywany jawnie, bo CTest NIE kasuje LastTestsFailed.log po
      # udanym przebiegu: plik z wczesniejszego, czerwonego biegu zostaje i sam z siebie
      # kazalby zebrac raport dla testu, ktory wlasnie przeszedl. Na koncu krok zwraca
      # kod ctest, wiec job pada dokladnie tak jak dotad.
      - run:
          name: Integration & Unit test
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            ( cd build/<< parameters.build_type >>/test \
              && ctest -j "$(nproc)" -V --output-junit test_results.xml ) && rc=0 || rc=$?
            python3 scripts/collect-test-failures.py build/<< parameters.build_type >> --ctest-status "$rc"
            exit "$rc"
      - store_test_results:
          path: build/<< parameters.build_type >>/test
      - store_artifacts:
          path: build/<< parameters.build_type >>/test/test_results.xml
          destination: test_results.xml
      # Raport niesie takze kopie calego LastTest.log (pelne wyjscie kazdego testu, bo CI
      # biegnie z -V). Osobnego artefaktu z oryginalu NIE ma celowo: kolektor buduje liste
      # testow przez `ctest --show-only`, a to nadpisuje LastTest.log pustym naglowkiem -
      # zapisany bylby wiec pusty plik. Kopia powstaje przed tym wolaniem.
      - store_artifacts:
          when: always
          path: build/<< parameters.build_type >>/test-failure-report
          destination: test-failure-report
  run-cppcheck:
    parameters:
      build_type:
        type: string
        default: "Release"
      build_tool:
        type: string
        default: "make"
    steps:
      - run:
          name: Static analysis
          command: |
            cd build/<< parameters.build_type >> && << parameters.build_tool >> cppcheck
  run-package:
    parameters:
      build_type:
        type: string
        default: "Release"
      build_tool:
        type: string
        default: "make"
    steps:
      - run:
          name: Package
          command: |
            cd build/<<parameters.build_type>> && <<parameters.build_tool>> packages

jobs:
  build-release-ninja-mydocker:
    working_directory: ~/retractordb
    executor: debian-mydocker
    steps:
      - checkout:
          method: blobless
      - check-skipci:
          enabled: false
      - prep-env:
          use_ninja: true
      - conan-install:
          build_param: --build missing
          build_tool: ninja
      - conan-build:
          build_param: --build missing
          build_tool: ninja
      - run-test:
          build_tool: ninja

  build-debug-ninja-mydocker:
    parameters:
      check_skipci:
        type: boolean
        default: true
    working_directory: ~/retractordb
    executor: debian-mydocker
    steps:
      - checkout:
          method: blobless
      - check-skipci:
          enabled: << parameters.check_skipci >>
      - prep-env:
          use_ninja: true
      - conan-install:
          build_type: Debug
          build_param: --build missing
          build_tool: ninja
      - conan-build:
          build_type: Debug
          build_param: --build missing
          build_tool: ninja
      - run-test:
          build_type: Debug
          build_tool: ninja

  # Bramka badawcza H9/H10 - ochrona osiagnietych wynikow przed regresja silnika
  # (test/research_gate/README.md). Celowo poza `ninja` i poza `ninja test`, wiec
  # musi byc wywolana jawnie; L2, bo to najdrozszy job w przebiegu.
  #
  # Release, nie Debug: bramka wykonuje ok. 20 000 kompilacji planow przez
  # xretractor. Sprawdzane zachowanie jest w obu konfiguracjach identyczne, czas
  # przebiegu nie jest.
  research-gate:
    working_directory: ~/retractordb
    executor: debian-mydocker
    steps:
      - checkout:
          method: blobless
      - check-skipci:
          enabled: false
      - prep-env:
          use_ninja: true
      - conan-install:
          build_param: --build missing
          build_tool: ninja
      - run:
          name: Configure Release tree (gate in strict mode)
          command: |
            cmake \
              -S . \
              -B build/Release \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/build/Release/generators/conan_toolchain.cmake" \
              -DRESEARCH_GATE_STRICT=ON
      # Poziom 84/84 hipotezy H9 odroznia R1 od R2 wylacznie na czterech profilach
      # ablacji. Bez nich bramka ten poziom POMIJA, a w trybie strict pominiecie
      # jest bledem - wiec profile musza powstac tutaj, w tym samym jobie i z tej
      # samej tresci src/ (bramka sprawdza odcisk).
      #
      # Rownoleglosc: 4, nie `$(nproc)`. W kontenerze `nproc` podaje rdzenie
      # HOSTA (36), nie przydzial kontenera - a wiazacym limitem i tak jest
      # pamiec: jedna jednostka kompilacji tego drzewa siega ~1 GiB RSS
      # (zmierzone: executorsm.cpp 0,93 GiB, launcher.cpp 0,86 GiB), executor
      # `large` ma 8 GiB. 36 rownoleglych g++ to ~30 GiB, czyli OOM: 2026-08-19
      # krok padl po 45 s bez jednej linii bledu i bez artefaktow, bo zabity
      # krok nie dochodzi do store_artifacts. Inne joby przechodza dlatego, ze
      # buduje je `conan build`, a conan liczy rownoleglosc z limitu cgroup, nie
      # z `nproc`. Liczba 4 idzie za `resource_class: large` (4 vCPU / 8 GiB) -
      # przy zmianie klasy executora zmienic tutaj.
      #
      # DRUGIE ZRODLO TEJ SAMEJ REGULY: `compute_build_jobs()` w
      # scripts/buildrdb.sh (~850 MB na zadanie, ~500 MB marginesu, wynik
      # ograniczony liczba rdzeni) - to jest ta sama arytmetyka, policzona dla
      # maszyny lokalnej. Kroku CI nie da sie do niej podpiac: kazdy `run:` to
      # osobna powloka, a funkcja siedzi w srodku 1500-liniowego skryptu. Stad
      # duplikat; przy zmianie zalozen poprawic OBA miejsca.
      #
      # `no_output_timeout`: CircleCI zabija krok, ktory przez 10 minut (domyslna
      # wartosc) nie napisal ani znaku. Oba te kroki sa z zalozenia MILCZACE:
      # wyjscie kompilatora idzie do plikow w build/gate-profiles-logs, a bramka
      # drukuje dopiero werdykt poziomu. Miedzy dwiema liniami "profil X ->"
      # mieszcza sie minuty kompilacji jednego profilu (lokalnie 4 min 20 s przy
      # -j4; na 4 vCPU kontenera odpowiednio dluzej) - kazdego prawie od zera,
      # bo profile maja osobne katalogi, a sciezka katalogu wchodzi do klucza
      # ccache (zmierzone 2026-09-19: drugi profil trafia w 8 z 68 jednostek) -
      # a w kroku bramki cala kampania 2 x 10010 planow. Dzielenie tego na osobne
      # kroki NIE pomaga - limit liczy sie per krok, nie per job.
      - run:
          name: Build H9 ablation profiles
          no_output_timeout: 30m
          command: |
            K6_BUILD_JOBS=4 test/research_gate/h9/build_profiles.sh
      - run:
          name: Research gate H9/H10
          no_output_timeout: 30m
          command: |
            cmake --build build/Release --target test_gate --parallel 4
      # `when: always`: artefakty sa potrzebne WLASNIE wtedy, gdy bramka padla -
      # bez tego nieudany przebieg nie zostawia ani logow builda profili, ani
      # katalogu roboczego bramki.
      - store_artifacts:
          path: build/Release/test/research_gate/gate-work
          destination: research-gate
          when: always
      - store_artifacts:
          path: build/gate-profiles-logs
          destination: research-gate-profiles
          when: always

  build-release:
    working_directory: ~/retractordb
    executor: ubuntu-docker
    steps:
      - checkout:
          method: blobless
      - check-skipci:
          enabled: false
      - prep-env-ci
      - conan-install:
          build_param: --build missing
      - conan-build:
          build_param: --build missing
      - run-test
      - run-package

  # Release build with an explicit optimizer switch combination.
  # scripts/buildrdb.sh release-ablation is interactive, so the CMake
  # configuration is spelled out here instead of reusing that option.
  build-release-ablation:
    parameters:
      dedup:
        type: string
        default: "ON"
      share:
        type: string
        default: "ON"
      commutative:
        type: string
        default: "ON"
      factor:
        type: string
        default: "ON"
      simplify:
        type: string
        default: "ON"
      probe:
        type: string
        default: "OFF"
    working_directory: ~/retractordb
    executor: debian-mydocker
    steps:
      - checkout:
          method: blobless
      - check-skipci:
          enabled: false
      - prep-env:
          use_ninja: true
      - conan-install:
          build_param: --build missing
          build_tool: ninja
      - run:
          name: Configure ablation variant
          command: |
            cmake \
              -S . \
              -B build/Release \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/build/Release/generators/conan_toolchain.cmake" \
              -DRDB_OPT_DEDUP_SUBSTRATES=<< parameters.dedup >> \
              -DRDB_OPT_SHARE_EQUIVALENT_SELECTS=<< parameters.share >> \
              -DRDB_OPT_COMMUTATIVE_ADD=<< parameters.commutative >> \
              -DRDB_OPT_FACTOR_MATCHED_HASH_TIMEMOVES=<< parameters.factor >> \
              -DRDB_OPT_SIMPLIFY_EXPRESSIONS=<< parameters.simplify >> \
              -DRDB_BENCH_PROBE=<< parameters.probe >>
      # Rownoleglosc 4, nie `$(nproc)` i nie domyslna ninja (`nproc`+2): powod
      # jak w jobie research-gate wyzej - w kontenerze `nproc` podaje rdzenie
      # HOSTA, a jedna jednostka kompilacji tego drzewa siega ~1 GiB RSS przy
      # 8 GiB executora `large`. Odpowiednik `compute_build_jobs()` z
      # scripts/buildrdb.sh, policzony recznie dla tego executora.
      #
      # Od 2026-08-19 ten job jest tez podloga ablacyjna warstwy L2 przebiegu
      # nocnego (`ablation-all-off`), a nie tylko czescia recznej matrycy -
      # `--parallel 4` przestalo byc zabezpieczeniem teoretycznym.
      - run:
          name: Build and install ablation variant
          command: |
            cmake --build build/Release --parallel 4
            cd build/Release && ninja -j 4 install
      - run:
          name: Verify compiled switches match the requested profile
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            actual="$(xretractor --build-info)"
            expected="$(printf '%s\n' \
              "RDB_OPT_DEDUP_SUBSTRATES=<< parameters.dedup >>" \
              "RDB_OPT_SHARE_EQUIVALENT_SELECTS=<< parameters.share >>" \
              "RDB_OPT_COMMUTATIVE_ADD=<< parameters.commutative >>" \
              "RDB_OPT_FACTOR_MATCHED_HASH_TIMEMOVES=<< parameters.factor >>" \
              "RDB_BENCH_PROBE=<< parameters.probe >>" \
              "RDB_OPT_SIMPLIFY_EXPRESSIONS=<< parameters.simplify >>")"
            printf '%s\n' "$actual"
            if [ "$actual" != "$expected" ]; then
              echo "Error: built binary does not report the requested optimizer configuration."
              printf 'expected:\n%s\n' "$expected"
              exit 1
            fi
      - run-test:
          build_tool: ninja

  build-ARM:
    parameters:
      build_type:
        type: string
        default: "Debug"
      build_tool:
        type: string
        default: "make"
    working_directory: ~/retractordb
    executor: ubuntu-machine-arm
    steps:
      - checkout:
          method: blobless
      - check-skipci:
          enabled: false
      - prep-env-ci
      # ConanCenter nie ma binarki cmake dla Linux armv8, wiec tool_requires z
      # conanfile.py wolalo build() recepty, a ten pobiera archiwum z cmake.org.
      # 2026-09-15 cmake.org oddawal 403 na wszystko i job padl. Kolo z PyPI
      # (najnowsze, jakie jest dla aarch64) zglaszamy conanowi jako narzedzie
      # platformy - cmake.org znika ze sciezki joba. Podloga z conanfile.py
      # nadal obowiazuje: wpis ponizej [>=4.4.2] conan pomija i wraca do recepty
      # (czyli znow do cmake.org), a nie buduje starszym cmake.
      - run:
          name: Use newest PyPI cmake as Conan platform tool (ARM)
          command: |
            pip install --upgrade --only-binary=:all: cmake
            case "$(command -v cmake)" in
              "$HOME"/.venv/bin/cmake) ;;
              *) echo "Error: cmake z PATH nie pochodzi z ~/.venv: $(command -v cmake)"; exit 1 ;;
            esac
            cmake_ver=$(cmake --version | head -n1 | awk '{print $3}')
            printf '\n[platform_tool_requires]\ncmake/%s\n' "$cmake_ver" >> ~/.conan2/profiles/default
      - run:
          name: Toolchain diagnostics (ARM)
          command: |
            uname -a || true
            gcc --version || true
            g++ --version || true
            g++ -dumpfullversion || true
            cmake --version || true
            ls /usr/include/c++/ || true
            echo "--- conan profile default ---"
            cat ~/.conan2/profiles/default || true
      - conan-install:
          build_type: << parameters.build_type >>
          build_param: --build missing
      - conan-build:
          build_type: << parameters.build_type >>
          build_param: --build missing
          build_tool: << parameters.build_tool >>
      - run-test:
          build_type: << parameters.build_type >>
          build_tool: << parameters.build_tool >>

  # Buda Debug i pelny zestaw testow na macOS/arm64.
  #
  # Caly przebieg robi scripts/macos-build.sh - ten sam skrypt, ktorym port
  # powstawal i ktorym sprawdza sie go recznie. To jest cala wartosc tego
  # ukladu: CI nie dostaje wlasnej, rownoleglej sciezki budowania, ktora mogla by
  # rozjechac sie z ta, ktorej uzywa czlowiek. Skrypt sam robi preflight,
  # doinstalowuje brakujace narzedzia przez brew, laduje profil conana, buduje,
  # instaluje, uruchamia ctest i na koniec `ninja test-api` (testy klienta C++,
  # ktore poza tym wejsciem w ogole nie biegna - patrz EXCLUDE_FROM_ALL w api/cpp).
  #
  # Dlatego job NIE uzywa `prep-env` / `conan-install` / `conan-build` /
  # `run-test`: tamte wolaja `scripts/buildrdb.sh toolchain conan` (apt) i czytaja
  # /proc/version oraz /etc/issue, czego na Darwinie nie ma.
  build-debug-macos:
    working_directory: ~/retractordb
    executor: macos-m4
    steps:
      - checkout:
          method: blobless
      # Workflow reczny, wiec [skipci] nie ma czego pomijac - tak samo jak build-ARM.
      - check-skipci:
          enabled: false
      # Cache conana wazy tu wiecej niz w jobach linuksowych: obraz CircleCI nie
      # jest naszym obrazem, wiec nie ma prebuiltow z docker/ci/Dockerfile i
      # pierwszy przebieg buduje Boost oraz ANTLR ze zrodel. Klucz sklada sie z
      # conanfile.py (lista zaleznosci) i z wersji Xcode - zmiana kompilatora
      # uniewaznia ABI, wiec musi uniewaznic i cache.
      - restore_cache:
          keys:
            - conan-macos-xcode27.0-{{ checksum "conanfile.py" }}
            - conan-macos-xcode27.0-
      - run:
          name: Build and test (scripts/macos-build.sh)
          # Pierwszy przebieg z zimnym cache buduje Boost ze zrodel i potrafi
          # milczec dluzej niz domyslne 10 minut CircleCI.
          no_output_timeout: 45m
          command: scripts/macos-build.sh debug
      - save_cache:
          key: conan-macos-xcode27.0-{{ checksum "conanfile.py" }}
          paths:
            - ~/.conan2
      # Junit trafia do osobnego katalogu, a nie prosto z build/Debug: CircleCI
      # skanuje wskazana sciezke po *.xml, a CTest zostawia obok wlasne pliki w
      # Testing/ - nie sa w formacie junit i kolektor by sie o nie potykal.
      - run:
          name: Collect test results
          when: always
          command: |
            mkdir -p /tmp/macos-test-results
            cp build/Debug/test_results.xml /tmp/macos-test-results/ 2>/dev/null || true
      - store_test_results:
          path: /tmp/macos-test-results
      # `when: always`, bo dziennik jest potrzebny WLASNIE wtedy, gdy krok wyzej
      # padl: skrypt dopisuje do niego preflight, wynik kazdego etapu i powtorke
      # nieudanych testow pojedynczo z -V. Bez tego z czerwonego joba zostaje samo
      # "exit 1".
      - store_artifacts:
          when: always
          path: build/macos-build.log
          destination: macos-build.log
      - store_artifacts:
          when: always
          path: /tmp/macos-test-results/test_results.xml
          destination: test_results.xml
