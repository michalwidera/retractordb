# RetractorDB configuration installed with the portable CLI archive.
# xretractor loads /etc/retractor/retractor.toml for a system installation,
# or $XDG_CONFIG_HOME/retractor/retractor.toml for a user installation.
# Existing local configuration is preserved during upgrades.

[ipc]
queue_buffer_seconds = 10
min_queue_elements = 100
client_response_max_fails = 300

# Set a storage directory only after creating it and granting xretractor
# write access. The built-in default leaves storage.dir unset.
# [storage]
# dir = "/var/lib/retractor"

# Read deadline in seconds for DEVICE sources (character devices, FIFOs) whose DECLARE has
# no TIMEOUT clause. 0, the default, is one immediate attempt: no complete record in a due
# slot gives an all-null record without waiting. An explicit TIMEOUT in RQL wins, including
# TIMEOUT 0. A negative value stops xretractor at startup with a configuration error.
# [sources]
# timeout_s = 0.0

[service]
# Allow a DO SYSTEM rule in a plan accepted over the `xqry --reset` channel.
# false (the default) refuses such a plan as a whole: the reset channel carries no
# authorship, so a rule that runs an arbitrary shell command may only be asked for in
# the plan file the service starts from. Set true only if you deliberately hand this
# channel over - anyone able to open this instance's IPC objects then runs shell
# commands under the service account.
unrestricted = false
